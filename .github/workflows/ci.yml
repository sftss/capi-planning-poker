name: CI

# Déclencheurs : push et pull request qui vise main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Droits minimum (seulement lire)
permissions:
  contents: read

jobs:
  # Un seul job ("test") qui tourne sur une machine Linux fournie de GitHub
  test:
    runs-on: ubuntu-latest
    steps:
      # Récupère le code du dépôt sur la machine
      # Action sur un SHA de commit
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Installe Python 3.12
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Installe notre paquet "capi" et pytest
      - run: pip install -e ".[dev]"

      # Lance tous les tests, si un test échoue pytest renvoie une erreur, le run passe en rouge
      - run: pytest
